# Site Settings
title                    : "Yao-Zhong Kang"
description : >-
  Personal academic homepage of Yao-Zhong Kang, an M.Sc. candidate
  working on scientific machine learning and numerical methods for reactor physics.
repository               : "YaoZhong-Kang/YaoZhong-Kang.github.io"
google_scholar_stats_use_cdn : true

# Google Analytics
google_analytics_id      :G-J6D6ZLF2M6

# SEO Related
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site Author
author:
  name             : "Yao-Zhong Kang"

  # Upload your portrait to images/profile.jpg
  avatar           : "images/profile.jpg"

  bio              : "M.Sc. Candidate | Scientific Machine Learning × Reactor Physics"

  location         : "Shanghai, China"

  employer         : "Shanghai University · SINAP, CAS"

  pubmed           :

  # Leave blank until you have a Google Scholar profile
  googlescholar    :

  # Add your preferred academic/contact email here
  email            : "kangyaozhong@sinap.ac.cn"

  researchgate     :

  uri              : "https://YaoZhong-Kang.github.io"

  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :

  github           : "YaoZhong-Kang"

  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :

  linkedin         :

  dblp             :

  orcid            :

  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
